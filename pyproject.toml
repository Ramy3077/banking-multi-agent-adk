[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent retail-banking assistant built on Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.5.0",
    "google-adk[eval]>=1.28.1,<2",
    "google-cloud-bigquery>=3.40.1",
    "pandas>=2.3.3",
]

[tool.uv]
# starlette <1.x carries several advisories; google-adk 1.x does not require the old line.
# google-cloud-aiplatform[evaluation] (via google-adk[eval]) caps litellm below 1.86 on Python < 3.14, which keeps a
# litellm advisory open (patched in 1.88.6). The eval path used here does not depend on the older line.
override-dependencies = ["starlette>=1.3.1", "cryptography>=50.0.0", "litellm>=1.88.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
