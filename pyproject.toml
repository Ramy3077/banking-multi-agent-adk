[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent retail-banking assistant built on Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.5.0",
    "google-adk[eval]>=1.28.1,<2",
    "google-cloud-bigquery>=3.40.1",
    "pandas>=2.3.3",
]

[tool.uv]
# starlette <1.x carries several advisories; google-adk 1.x does not require the old line.
override-dependencies = ["starlette>=1.3.1"]
